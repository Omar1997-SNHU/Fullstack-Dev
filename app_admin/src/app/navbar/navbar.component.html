<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">

    <a class="navbar-brand" routerLink="/">
      Travlr Getaways Admin
    </a>

    <div class="navbar-nav ms-auto d-flex flex-row align-items-center gap-3">

      <ng-container *ngIf="authService.isLoggedIn(); else loggedOut">
        <span class="navbar-text text-light">
          Welcome, {{ authService.getCurrentUser()?.name }}
        </span>
        <button class="btn btn-outline-light btn-sm" (click)="onLogout()">
          Logout
        </button>
      </ng-container>

      <ng-template #loggedOut>
        <a routerLink="/login" class="btn btn-outline-light btn-sm">
          Login
        </a>
      </ng-template>

    </div>
  </div>
</nav>
